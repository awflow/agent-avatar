name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # the bins and the runtime smoke run under plain Node: engines >=20
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Core size is committed
        run: |
          bun scripts/size.ts
          git diff --exit-code -- apps/web/src/generated/size.json

      - name: Pack, check and smoke the tarballs
        run: bun scripts/release.ts
